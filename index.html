<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="hmlmuVNZ5pD0goV7t7toQuF5QUK3DEh4IjhvDMZ0NIQ" />

<title>Ukrainian Noun Case Quiz</title>
</head>
<body>

<h1>Ukrainian Noun Case Quiz</h1>
<p>Тренажер відмінків іменників</p>

<div id="setup-area">
  <fieldset id="mode-filters"><legend>Mode / Режим</legend></fieldset>
  <fieldset id="tier-filters"><legend>Version / Версія</legend></fieldset>
  <fieldset id="gender-filters"><legend>Gender / Рід</legend></fieldset>
  <fieldset id="number-filters"><legend>Number / Число</legend></fieldset>
  <fieldset id="case-filters"><legend>Cases / Відмінки</legend></fieldset>

  <button id="start-btn" disabled>Start</button>
  <p id="status">Loading...</p>
</div>

<div id="quiz-area" style="display:none;">
  <p id="scoreboard">Correct: 0 | Incorrect: 0</p>
  <p id="prompt"></p>

  <div id="typed-area">
    <input type="text" id="answer-input" autocomplete="off">
    <button id="submit-btn">Submit</button>
  </div>

  <div id="choice-area" style="display:none;"></div>

  <button id="next-btn" style="display:none;">Next question</button>
  <p id="feedback"></p>
  <p id="resources"></p>

  <button id="start-over-btn">Start Over</button>
</div>

<script>
  let quizData = [];
  let currentQuestion = null;
  let quizStarted = false;
  let correctCount = 0;
  let incorrectCount = 0;
  let askedQuestions = new Set(); // keys of "wordId|case|number" already asked this session

  const CASE_LABELS = {
    nominative:   "nominative (називний)",
    genitive:     "genitive (родовий)",
    dative:       "dative (давальний)",
    accusative:   "accusative (знахідний)",
    instrumental: "instrumental (орудний)",
    locative:     "locative (місцевий)",
    vocative:     "vocative (кличний)",
  };

  const GENDER_LABELS = {
    masculine:   "masculine (чоловічий рід)",
    feminine:    "feminine (жіночий рід)",
    neuter:      "neuter (середній рід)",
    plural_only: "plural-only nouns, e.g. \"двері\" (множинний)",
  };

  const NUMBER_LABELS = {
    singular: "singular (однина)",
    plural:   "plural (множина)",
  };

  const MODE_LABELS = {
    typed:  "Type the answer",
    choice: "Multiple choice",
  };

  const CASE_NAMES = Object.keys(CASE_LABELS);
  const GENDERS = Object.keys(GENDER_LABELS);
  const NUMBERS = Object.keys(NUMBER_LABELS);
  const MODES = Object.keys(MODE_LABELS);
  let TIER_LABELS = {};

  // Learning-resource links shown after a WRONG answer, chosen based
  // on the gender and case of the question just missed. plural_only
  // has no entry on purpose -- no link was given for it, so it's
  // simply skipped rather than guessed at.
  const GENDER_RESOURCES = {
    masculine: { label: "chart of masculine noun cases", url: "https://web.archive.org/web/20251212060316/https://www.ukrainianlanguage.org.uk/read/unit06/page6-5.htm" },
    feminine:  { label: "chart of feminine noun cases",  url: "https://web.archive.org/web/20260308191207/https://www.ukrainianlanguage.org.uk/read/unit06/page6-4.htm" },
    neuter:    { label: "chart of neuter noun cases",    url: "https://web.archive.org/web/20251211142504/https://www.ukrainianlanguage.org.uk/read/unit06/page6-6.htm" },
  };

  const CASE_RESOURCES = {
    nominative:   { label: "explanation of the nominative case",   url: "https://web.archive.org/web/20221124203756/https://www.ukrainianlanguage.org.uk/read/unit07/page7-1.htm" },
    genitive:     { label: "explanation of the genitive case",     url: "https://web.archive.org/web/20241007011949/https://www.ukrainianlanguage.org.uk/read/unit07/page7-3.htm" },
    dative:       { label: "explanation of the dative case",       url: "https://web.archive.org/web/20260305090406/https://www.ukrainianlanguage.org.uk/read/unit07/page7-5.htm" },
    accusative:   { label: "explanation of the accusative case",   url: "https://web.archive.org/web/20260306061233/https://www.ukrainianlanguage.org.uk/read/unit07/page7-4.htm" },
    instrumental: { label: "explanation of the instrumental case", url: "https://web.archive.org/web/20250817234605/https://www.ukrainianlanguage.org.uk/read/unit07/page7-6.htm" },
    locative:     { label: "explanation of the locative case",     url: "https://web.archive.org/web/20260305114455/http://www.ukrainianlanguage.org.uk:80/read/unit07/page7-2.htm" },
    vocative:     { label: "explanation of the vocative case",     url: "https://web.archive.org/web/20260311165229/https://www.ukrainianlanguage.org.uk/read/unit07/page7-7.htm" },
  };

  function normalizeAnswer(str) {
    return str
      .replace(/\u0301/g, "")
      .replace(/[\u2019\u02BC\u0060\u00B4]/g, "'")
      .toLowerCase()
      .trim();
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildCheckboxes(containerId, keys, labelMap, groupName) {
    const container = document.getElementById(containerId);
    keys.forEach((key) => {
      const label = document.createElement("label");
      label.style.display = "block";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = false; // start deselected -- you choose what to practice
      checkbox.dataset.group = groupName;
      checkbox.dataset.value = key;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(" " + labelMap[key]));
      container.appendChild(label);
    });
  }

  function buildRadios(containerId, keys, labelMap, groupName, defaultKey) {
    const container = document.getElementById(containerId);
    keys.forEach((key) => {
      const label = document.createElement("label");
      label.style.display = "block";
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = groupName;
      radio.checked = key === defaultKey;
      radio.dataset.group = groupName;
      radio.dataset.value = key;
      label.appendChild(radio);
      label.appendChild(document.createTextNode(" " + labelMap[key]));
      container.appendChild(label);
    });
  }

  function getChecked(groupName) {
    const boxes = document.querySelectorAll('input[data-group="' + groupName + '"]:checked');
    return Array.from(boxes).map((box) => box.dataset.value);
  }

  function getSelectedMode() {
    const checked = document.querySelector('input[data-group="mode"]:checked');
    return checked ? checked.dataset.value : "typed";
  }

  function dictionaryForm(word) {
    return word.cases.nominative.singular[0] || word.cases.nominative.plural[0];
  }

  // Enumerate EVERY (word, case, number) combination that matches the
  // current filters and hasn't been asked yet this session. We do a
  // full enumeration (rather than random-guess-and-retry) specifically
  // so we can reliably detect "you've used up every question" instead
  // of just failing after a fixed number of guesses.
  function getValidCombos() {
    const selectedTiers = getChecked("tier");
    const selectedCases = getChecked("case");
    const selectedGenders = getChecked("gender");
    const selectedNumbers = getChecked("number");

    if (selectedTiers.length === 0 || selectedCases.length === 0 || selectedGenders.length === 0 || selectedNumbers.length === 0) {
      return { error: "Select at least one option in every category to continue." };
    }

    const candidateWords = quizData.filter(
      (w) => selectedTiers.includes(w.tier) && selectedGenders.includes(w.gender)
    );
    if (candidateWords.length === 0) {
      return { error: "No words match the selected version/genders." };
    }

    const combos = [];
    for (const word of candidateWords) {
      for (const caseName of selectedCases) {
        for (const number of selectedNumbers) {
          const forms = word.cases[caseName][number];
          if (forms && forms.length > 0) {
            const key = word._id + "|" + caseName + "|" + number;
            if (!askedQuestions.has(key)) {
              combos.push({ word, caseName, number, forms, key });
            }
          }
        }
      }
    }

    if (combos.length === 0) {
      return { error: 'You\'ve answered every available question for these filters! Press "Start Over" to reset and try again.' };
    }

    return { combos };
  }

  function pickRandomQuestion() {
    const result = getValidCombos();
    if (result.error) return { error: result.error };
    const chosen = result.combos[Math.floor(Math.random() * result.combos.length)];
    askedQuestions.add(chosen.key);
    return chosen;
  }

  // --- Multiple-choice distractor generation ---
  function collectAllForms(word) {
    const all = [];
    for (const caseName of Object.keys(word.cases)) {
      for (const number of NUMBERS) {
        const forms = word.cases[caseName][number];
        if (forms) all.push(...forms);
      }
    }
    return all;
  }

  function generateChoices(question) {
    const correct = question.forms[0];
    const seen = new Set(question.forms.map(normalizeAnswer));
    let pool = collectAllForms(question.word).filter((f) => !seen.has(normalizeAnswer(f)));
    shuffle(pool);

    const distractors = [];
    for (const f of pool) {
      const norm = normalizeAnswer(f);
      if (seen.has(norm)) continue;
      seen.add(norm);
      distractors.push(f);
      if (distractors.length >= 3) break;
    }

    let attempts = 0;
    while (distractors.length < 3 && attempts < 200) {
      attempts++;
      const other = quizData[Math.floor(Math.random() * quizData.length)];
      if (other === question.word) continue;
      const otherForms = other.cases[question.caseName][question.number];
      if (!otherForms || otherForms.length === 0) continue;
      const candidate = otherForms[0];
      const norm = normalizeAnswer(candidate);
      if (seen.has(norm)) continue;
      seen.add(norm);
      distractors.push(candidate);
    }

    return shuffle([correct, ...distractors]);
  }

  function updateScoreboard() {
    document.getElementById("scoreboard").textContent =
      "Correct: " + correctCount + " | Incorrect: " + incorrectCount;
  }

  function showQuestion() {
    currentQuestion = pickRandomQuestion();
    const typedArea = document.getElementById("typed-area");
    const choiceArea = document.getElementById("choice-area");

    if (currentQuestion.error) {
      document.getElementById("prompt").textContent = currentQuestion.error;
      typedArea.style.display = "none";
      choiceArea.style.display = "none";
      document.getElementById("next-btn").style.display = "none";
      return;
    }

    const base = dictionaryForm(currentQuestion.word);
    document.getElementById("prompt").textContent =
      CASE_LABELS[currentQuestion.caseName] + ", " + NUMBER_LABELS[currentQuestion.number] + ' of "' + base + '"';
    document.getElementById("feedback").textContent = "";
    document.getElementById("resources").innerHTML = "";
    document.getElementById("next-btn").style.display = "none";

    const mode = getSelectedMode();
    if (mode === "choice") {
      typedArea.style.display = "none";
      choiceArea.style.display = "block";
      choiceArea.innerHTML = "";
      generateChoices(currentQuestion).forEach((choiceText) => {
        const btn = document.createElement("button");
        btn.textContent = choiceText;
        btn.style.display = "block";
        btn.addEventListener("click", function () { checkChoiceAnswer(choiceText); });
        choiceArea.appendChild(btn);
      });
    } else {
      typedArea.style.display = "block";
      choiceArea.style.display = "none";
      document.getElementById("answer-input").value = "";
      document.getElementById("answer-input").focus();
    }
  }

  function showFeedback(isCorrect) {
    if (isCorrect) correctCount++; else incorrectCount++;
    updateScoreboard();
    const displayForms = currentQuestion.forms.join(", ");
    document.getElementById("feedback").textContent = isCorrect
      ? "Correct! Правильно! (" + displayForms + ")"
      : "Not quite. Неправильно. Correct answer: " + displayForms;

    const resourcesEl = document.getElementById("resources");
    resourcesEl.innerHTML = "";
    if (!isCorrect) {
      // Depending on the question: a gender resource (skipped for
      // plural-only words, which have none), plus a case resource
      // (always available, all 7 cases have a link).
      const links = [];
      const genderResource = GENDER_RESOURCES[currentQuestion.word.gender];
      if (genderResource) links.push(genderResource);
      const caseResource = CASE_RESOURCES[currentQuestion.caseName];
      if (caseResource) links.push(caseResource);

      if (links.length > 0) {
        resourcesEl.appendChild(document.createTextNode("Learn more: "));
        links.forEach((res, i) => {
          const a = document.createElement("a");
          a.href = res.url;
          a.textContent = res.label;
          a.target = "_blank";
          a.rel = "noopener";
          resourcesEl.appendChild(a);
          if (i < links.length - 1) resourcesEl.appendChild(document.createTextNode(" | "));
        });
      }
    }

    document.getElementById("next-btn").style.display = "inline";
  }

  function checkAnswer() {
    const userAnswer = normalizeAnswer(document.getElementById("answer-input").value);
    const accepted = currentQuestion.forms.map(normalizeAnswer);
    document.getElementById("submit-btn").style.display = "none";
    showFeedback(accepted.includes(userAnswer));
  }

  function checkChoiceAnswer(selected) {
    const accepted = currentQuestion.forms.map(normalizeAnswer);
    const isCorrect = accepted.includes(normalizeAnswer(selected));
    Array.from(document.getElementById("choice-area").children).forEach((btn) => (btn.disabled = true));
    showFeedback(isCorrect);
  }

  function startQuiz() {
    quizStarted = true;
    correctCount = 0;
    incorrectCount = 0;
    askedQuestions = new Set();
    updateScoreboard();
    document.getElementById("setup-area").style.display = "none";
    document.getElementById("quiz-area").style.display = "block";
    window.scrollTo(0, 0);
    showQuestion();
  }

  function startOver() {
    quizStarted = false;
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("setup-area").style.display = "block";
    window.scrollTo(0, 0);
  }

  document.getElementById("submit-btn").addEventListener("click", checkAnswer);
  document.getElementById("next-btn").addEventListener("click", showQuestion);
  document.getElementById("answer-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") checkAnswer();
  });
  document.getElementById("start-btn").addEventListener("click", startQuiz);
  document.getElementById("start-over-btn").addEventListener("click", startOver);

  buildRadios("mode-filters", MODES, MODE_LABELS, "mode", "typed");
  buildCheckboxes("gender-filters", GENDERS, GENDER_LABELS, "gender");
  buildCheckboxes("number-filters", NUMBERS, NUMBER_LABELS, "number");
  buildCheckboxes("case-filters", CASE_NAMES, CASE_LABELS, "case");

  fetch("quiz_data.json")
    .then((response) => response.json())
    .then((data) => {
      quizData = data;
      quizData.forEach((w, i) => { w._id = i; }); // stable id per word, used for the no-repeat tracking

      const coreCount = quizData.filter((w) => w.tier === "core").length;
      const extendedCount = quizData.filter((w) => w.tier === "extended").length;
      TIER_LABELS = {
        core: "Core (" + coreCount + " basic nouns)",
        extended: "Extended (" + extendedCount + " randomly selected nouns)",
      };
      buildCheckboxes("tier-filters", Object.keys(TIER_LABELS), TIER_LABELS, "tier");

      document.getElementById("status").textContent = "Choose your filters, then press Start.";
      document.getElementById("start-btn").disabled = false;
    })
    .catch((err) => {
      document.getElementById("status").textContent =
        "Couldn't load quiz_data.json -- make sure you're running this through " +
        "'python -m http.server' and visiting localhost, not double-clicking the file.";
      console.error(err);
    });
</script>

</body>
</html>
